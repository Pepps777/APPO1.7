services:
  - type: web
    name: appo-familienkalender
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: APP_PIN
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: appo-calendar-data
      mountPath: /var/data
      sizeGB: 1
